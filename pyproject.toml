[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spiraton"
# Source unique de vérité : spiraton/__init__.py (__version__). Lue par AST,
# donc sans importer torch au moment du build.
dynamic = ["version"]
description = "Spiraton: operator-based spiral computation cell (dextro/levogyre, log-domain mul/div)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

authors = [
  { name = "Rhaoul" }
]

dependencies = [
  "torch>=2.0"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  # Requis par le pont tokenizer (data/tokenizer_bridge.py, data/featurizers.py,
  # imports paresseux) et par les stubs des tests du chantier 7 ; les wheels
  # torch CPU >= 2.1 ne tirent plus numpy d'office.
  "numpy>=1.21"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "spiraton.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["spiraton*"]
exclude = ["tests*", "examples*", "scripts*"]

# 👇 Inclusion explicite des fichiers éthiques et de gouvernance
[tool.setuptools.package-data]
"spiraton" = [
  "MANIFESTE.md",
  "REFUS.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["spiraton"]

[tool.coverage.report]
show_missing = true
skip_covered = true
